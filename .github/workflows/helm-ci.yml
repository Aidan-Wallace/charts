name: Helm CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "charts/**"
      - ".github/workflows/helm-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "v3.18.2"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.base_ref }})
          if [[ -n "$changed" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        # version bump will come from release action
        run: ct lint --target-branch ${{ github.base_ref }} --lint-conf .ct/lintconf.yaml --check-version-increment false

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        if: steps.list-changed.outputs.changed == 'true'
        with:
          # https://github.com/kubernetes-sigs/kind
          version: "v0.29.0"

      - name: Run chart-testing (install+upgrade)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --upgrade --target-branch ${{ github.base_ref }}

  validate-helm-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run helm-values-schema-json
        uses: losisin/helm-values-schema-json-action@v3
        with:
          values: values.yaml
          useHelmDocs: true
          fail-on-diff: true
          working-directory: charts/homepage

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@v2
        with:
          chart-search-root: charts/homepage
          fail-on-diff: true
          skip-version-footer: true
